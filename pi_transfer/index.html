<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Diagnostics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #111418;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #1a1e24;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2d333b;
        }
        header h1 {
            font-size: 16px;
            font-weight: bold;
        }
        .meta {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
        }
        .fps {
            background: #252b33;
            padding: 3px 8px;
            border-radius: 4px;
            color: #58a6ff;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #da3633;
        }
        .dot.active {
            background: #238636;
        }
        .content {
            display: flex;
            height: calc(100vh - 45px);
        }
        .stream-view {
            flex: 3;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stream-view img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .sidebar {
            flex: 1;
            min-width: 310px;
            max-width: 380px;
            background: #161b22;
            border-left: 1px solid #2d333b;
            display: flex;
            flex-direction: column;
        }
        .section-box {
            padding: 10px;
            border-bottom: 1px solid #2d333b;
        }
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .auto-circuit-card {
            background: #21262d;
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid #30363d;
            font-size: 13px;
            font-weight: bold;
            color: #58a6ff;
        }
        .circuit-badge {
            margin-top: 6px;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .badge-pass {
            background: #13231b;
            color: #3fb950;
            border: 1px solid #238636;
        }
        .badge-fault {
            background: #331518;
            color: #f85149;
            border: 1px solid #da3633;
        }
        .modes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .btn {
            padding: 8px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
        }
        .btn:hover {
            border-color: #58a6ff;
        }
        .btn.active {
            background: #1f6feb;
            color: #fff;
            border-color: #388bfd;
        }
        .btn-action {
            width: 100%;
            margin-top: 6px;
            padding: 7px;
            background: #238636;
            color: #fff;
            border: 1px solid #2ea043;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-action:hover {
            background: #2ea043;
        }
        .toggles {
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .toggles label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .errors-list {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .error-card {
            padding: 6px 8px;
            background: #2b1114;
            border-left: 3px solid #f85149;
            border-radius: 3px;
            font-size: 11px;
            line-height: 1.3;
            color: #ff7b72;
        }
        .list-header {
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #2d333b;
            display: flex;
            justify-content: space-between;
        }
        .list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 4px;
            background: #21262d;
            font-size: 12px;
            border-left: 3px solid #58a6ff;
        }
        .log-box {
            max-height: 110px;
            overflow-y: auto;
            padding: 8px 10px;
            border-top: 1px solid #2d333b;
            background: #0d1117;
            font-family: monospace;
            font-size: 11px;
        }
        .log-title {
            color: #8b949e;
            font-size: 10px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .log-row {
            color: #ff7b72;
            padding: 1px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Circuit Diagnostics & Logic Verification</h1>
        <div class="meta">
            <span class="fps" id="fpsDisplay">-- FPS</span>
            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Connecting</span>
            </div>
        </div>
    </header>

    <div class="content">
        <div class="stream-view">
            <img id="videoFeed" src="/api/stream" alt="Video Feed" />
        </div>

        <div class="sidebar">
            <div class="section-box">
                <div class="section-title">Auto-Detected Circuit</div>
                <div id="circuitNameBox" class="auto-circuit-card">Scanning breadboard...</div>
                <div id="circuitStatusBadge" class="circuit-badge badge-pass">
                    <span id="circuitStatusText">CIRCUIT: CHECKING</span>
                    <span id="circuitErrorCount">0 Errors</span>
                </div>
            </div>

            <div class="section-box" id="errorSectionBox" style="display: none;">
                <div class="section-title" style="color: #f85149;">Pinpoint Faults</div>
                <div class="errors-list" id="faultList"></div>
            </div>

            <div class="section-box">
                <div class="section-title">Camera Control</div>
                <button class="btn-action" onclick="triggerAutofocus()">Refocus Camera</button>
            </div>

            <div class="section-box">
                <div class="section-title">Model Filter</div>
                <div class="modes">
                    <button class="btn active" onclick="setMode('all', this)">All</button>
                    <button class="btn" onclick="setMode('faults', this)">Faults</button>
                    <button class="btn" onclick="setMode('resistors', this)">Resistors</button>
                    <button class="btn" onclick="setMode('arduino', this)">Arduino</button>
                </div>
            </div>

            <div class="section-box">
                <div class="section-title">Voice & Sound</div>
                <div class="toggles">
                    <label>
                        <input type="checkbox" id="voiceEnabled" checked />
                        Voice alerts (TTS)
                    </label>
                    <label>
                        <input type="checkbox" id="buzzerEnabled" checked />
                        Buzzer tone before alert
                    </label>
                </div>
                <button class="btn-action" style="background: #1f6feb; border-color: #388bfd; margin-top: 8px;" onclick="testVoice()">Test Voice Alert</button>
            </div>

            <div class="list-header">
                <span>Detected Components</span>
                <span id="detCount">0</span>
            </div>

            <div class="list" id="detList">
                <div style="color: #8b949e; padding: 12px; text-align: center; font-size: 12px;">
                    No detections
                </div>
            </div>

            <div class="log-box">
                <div class="log-title">Voice Alert Log</div>
                <div id="voiceLog"></div>
            </div>
        </div>
    </div>

<script>
const POLL_INTERVAL = 500;
const ALERT_COOLDOWN = 7000;
const BEEP_FREQ = 880;
const BEEP_TIME = 150;

let currentMode = 'all';
const alertHistory = new Map();
let audioCtx = null;

function unlockAudio() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    } catch (e) {}
    try {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.resume();
        }
    } catch (e) {}
}

document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);
document.addEventListener('keydown', unlockAudio);

function triggerAutofocus() {
    fetch('/api/autofocus').catch(() => {});
}

function playBeep() {
    if (!document.getElementById('buzzerEnabled').checked) return;
    try {
        unlockAudio();
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(BEEP_FREQ, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + (BEEP_TIME / 1000));
    } catch (e) {}
}

function speakAlert(text) {
    if (!text) return;
    if (!document.getElementById('voiceEnabled').checked) return;

    const now = Date.now();
    const lastSpoken = alertHistory.get(text) || 0;
    if (now - lastSpoken < ALERT_COOLDOWN) return;

    alertHistory.set(text, now);
    unlockAudio();
    playBeep();

    if ('speechSynthesis' in window) {
        try {
            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = 1.0;
            msg.pitch = 1.0;
            msg.volume = 1.0;
            msg.lang = 'en-US';
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang && v.lang.startsWith('en'));
            if (preferredVoice) {
                msg.voice = preferredVoice;
            }
            window.speechSynthesis.speak(msg);
        } catch (e) {}
    }

    addLog(text);
}

function testVoice() {
    unlockAudio();
    const testPhrase = "Fault detected: Incorrect wire at pin 7. Solution: Move wire from pin 7 to pin 15.";
    alertHistory.delete(testPhrase);
    speakAlert(testPhrase);
}

function addLog(text) {
    const box = document.getElementById('voiceLog');
    const row = document.createElement('div');
    row.className = 'log-row';
    const time = new Date().toLocaleTimeString();
    row.textContent = `[${time}] ${text}`;
    box.insertBefore(row, box.firstChild);
    while (box.children.length > 15) {
        box.removeChild(box.lastChild);
    }
}

async function setMode(mode, btn) {
    try {
        const res = await fetch('/api/mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode })
        });
        const data = await res.json();
        if (data.success) {
            currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            speakAlert(`Mode set to ${mode}`);
        }
    } catch (e) {}
}

async function pollState() {
    try {
        const res = await fetch('/api/latest');
        const data = await res.json();

        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        if (data.camera_connected) {
            dot.classList.add('active');
            txt.textContent = 'Live';
        } else {
            dot.classList.remove('active');
            txt.textContent = 'Camera Off';
        }

        document.getElementById('fpsDisplay').textContent = `${data.fps || 0} FPS`;
        document.getElementById('detCount').textContent = data.num_detections || 0;

        const list = document.getElementById('detList');
        if (!data.detections || data.detections.length === 0) {
            list.innerHTML = '<div style="color: #8b949e; padding: 12px; text-align: center; font-size: 12px;">No detections</div>';
        } else {
            list.innerHTML = data.detections.map(d => {
                const name = d.class.replace(/[_-]/g, ' ');
                const pct = Math.round(d.confidence * 100);
                const resBadge = d.resistance ? ` <span style="background: #1f6feb; color: #fff; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-left: 6px; font-family: monospace;">${d.resistance}</span>` : '';
                return `
                    <div class="item">
                        <span style="text-transform: capitalize;">${name}${resBadge}</span>
                        <span style="color: #8b949e;">${pct}%</span>
                    </div>
                `;
            }).join('');
        }

        if (data.verification) {
            const v = data.verification;
            const nameBox = document.getElementById('circuitNameBox');
            const badge = document.getElementById('circuitStatusBadge');
            const statusText = document.getElementById('circuitStatusText');
            const errorCount = document.getElementById('circuitErrorCount');
            const errorBox = document.getElementById('errorSectionBox');
            const faultList = document.getElementById('faultList');

            if (v.circuit_name) {
                nameBox.textContent = v.circuit_name;
            }

            if (v.status === 'FAULT_DETECTED' && v.errors && v.errors.length > 0) {
                badge.className = 'circuit-badge badge-fault';
                statusText.textContent = 'FAULT DETECTED';
                errorCount.textContent = `${v.errors.length} Issue${v.errors.length > 1 ? 's' : ''}`;
                errorBox.style.display = 'block';

                const displayedErrors = v.errors.slice(0, 3);
                faultList.innerHTML = displayedErrors.map(err => {
                    const remedyHtml = err.remedy ? `
                        <div style="margin-top: 6px; padding: 6px 8px; background: #13231b; border: 1px solid #238636; border-radius: 4px; font-size: 11px; color: #3fb950; line-height: 1.4;">
                            <strong style="color: #56d364;">Solution:</strong> ${err.remedy}
                        </div>
                    ` : '';
                    return `<div class="error-card"><div>${err.message}</div>${remedyHtml}</div>`;
                }).join('');

                if (displayedErrors.length > 0) {
                    const speechText = displayedErrors[0].tts || (displayedErrors[0].remedy ? `Fault detected: ${displayedErrors[0].message}. Solution: ${displayedErrors[0].remedy}.` : `Fault detected: ${displayedErrors[0].message}.`);
                    speakAlert(speechText);
                }
            } else {
                badge.className = 'circuit-badge badge-pass';
                if (v.correction_applied) {
                    statusText.textContent = 'CIRCUIT IS NOW OK';
                    errorCount.textContent = 'VERIFIED';
                    badge.style.background = '#1b3824';
                    badge.style.borderColor = '#3fb950';
                    if (v.tts) {
                        speakAlert(v.tts);
                    }
                } else {
                    statusText.textContent = 'CIRCUIT: OK';
                    errorCount.textContent = '0 Errors';
                    badge.style.background = '';
                    badge.style.borderColor = '';
                }
                errorBox.style.display = 'none';
            }
        }

    } catch (e) {
        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        if (dot) dot.classList.remove('active');
        if (txt) txt.textContent = 'Server Off';
    }
}

const feed = document.getElementById('videoFeed');
feed.onerror = () => {
    setTimeout(() => {
        feed.src = '/api/stream?' + Date.now();
    }, 2000);
};

setInterval(pollState, POLL_INTERVAL);
pollState();
</script>
</body>
</html>
